<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gal Nakel — Visual Communication, Shenkar. Interactive portfolio."
    />
    <title>Gal Nakel — portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --muted: #4a4a4a;
        --blue: #0047ff;
        --blue-nav: #0047ff;
        --green: #a6ff00;
        --yellow: #ffff00;
        --orange: #ffb800;
        --pill-border: #0047ff;
        --font-body: "DM Sans", system-ui, sans-serif;
        --font-shapes: "Arial Narrow", "Helvetica Neue Condensed", "Helvetica Condensed",
          var(--font-body);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--blue-nav);
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        flex-shrink: 0;
      }
      .logo-link {
        display: flex;
        align-items: center;
        line-height: 0;
        text-decoration: none;
      }
      .site-logo {
        height: clamp(2.25rem, 6vw, 3rem);
        width: auto;
        max-width: min(240px, 55vw);
        object-fit: contain;
        object-position: left center;
      }
      .nav-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
      }
      .nav-pills a {
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--pill-border);
        border: 2px solid var(--pill-border);
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
      }
      .nav-pills a:hover {
        background: color-mix(in srgb, var(--blue) 8%, white);
      }
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding-bottom: 0.5rem;
      }
      .hero-composition {
        position: relative;
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: 0 0.75rem;
      }
      .hero-banner {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: top;
        user-select: none;
        pointer-events: none;
      }
      #drag-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        z-index: 2;
      }
      .shape-btn {
        position: absolute;
        margin: 0;
        padding: 0;
        border: none;
        cursor: grab;
        font-family: var(--font-shapes);
        font-weight: 800;
        font-stretch: condensed;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: #fff;
        text-align: center;
        line-height: 1.05;
        z-index: 8;
        box-shadow: 0 5px 0 rgb(0 0 0 / 14%);
        transition: filter 0.08s ease, box-shadow 0.08s ease;
      }
      .shape-btn:hover {
        filter: brightness(1.06);
      }
      .shape-btn.is-dragging {
        cursor: grabbing;
        z-index: 40 !important;
        box-shadow: 0 10px 22px rgb(0 0 0 / 20%);
        outline: 2px solid rgb(0 0 0 / 12%);
        outline-offset: 2px;
      }
      .shape-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.08em;
        width: 100%;
        height: 100%;
        padding: 0.45rem;
        pointer-events: none;
      }
      .shape-line {
        display: block;
        font-size: clamp(0.58rem, 1.65vw, 0.82rem);
      }
      .shape-blob-blue {
        width: min(200px, 40vw);
        height: min(128px, 26vw);
        border-radius: 58% 42% 62% 38% / 48% 55% 45% 52%;
        background: var(--blue);
      }
      .shape-oval-green {
        width: min(112px, 24vw);
        height: min(196px, 42vw);
        border-radius: 999px;
        background: var(--green);
        color: #0d1600;
      }
      .shape-oval-green .shape-inner {
        transform: scaleX(0.92) scaleY(1.12);
      }
      .shape-oval-green .shape-line {
        font-size: clamp(0.68rem, 2vw, 0.9rem);
      }
      .shape-star-yellow {
        width: min(176px, 38vw);
        height: min(176px, 38vw);
        background: var(--yellow);
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 100%,
          50% 74%,
          21% 100%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        color: #111;
        box-shadow: none;
        filter: drop-shadow(0 4px 0 rgb(0 0 0 / 12%));
      }
      .shape-star-yellow .shape-inner {
        transform: rotate(-16deg);
      }
      .shape-diamond-orange {
        width: min(148px, 32vw);
        height: min(148px, 32vw);
        background: var(--orange);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }
      .shape-diamond-orange .shape-inner {
        transform: rotate(-45deg);
      }
      .shape-diamond-orange .shape-line {
        font-size: clamp(0.52rem, 1.45vw, 0.7rem);
      }
      .site-footer {
        text-align: center;
        padding: 0.75rem 1.25rem 1.25rem;
        font-size: 0.9rem;
        color: var(--muted);
        flex-shrink: 0;
      }
      .load-error {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #b00020;
        margin: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo-link" href="./" aria-label="Gal Nakel — home">
        <img class="site-logo" src="/media/logo.png" alt="Gal Nakel" width="320" height="80" />
      </a>
      <nav class="nav-pills" aria-label="Primary">
        <a href="./work.html?id=about-me">about me</a>
        <a href="./work.html?id=side-quests">side quests &amp; fun stuff</a>
      </nav>
    </header>

    <div class="main-area">
      <h1 class="visually-hidden">Gal Nakel — portfolio</h1>
      <div class="hero-composition">
        <img
          class="hero-banner"
          src="/media/banner.png"
          alt="Welcome — Gal Nakel, Visual Communication at Shenkar"
          width="1600"
          height="900"
          decoding="async"
          fetchpriority="high"
        />
        <div id="drag-stage" aria-label="Draggable project buttons"></div>
      </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
