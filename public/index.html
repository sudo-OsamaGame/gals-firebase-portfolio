<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Design school visual work — images and video." />
    <title>Portfolio — design school</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101012;
        --surface: #18181b;
        --fg: #f4f2ef;
        --muted: #a19d96;
        --line: #2a2a2e;
        --accent: #d4bc6a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: inherit;
      }
      .brand img {
        height: 2.25rem;
        width: auto;
        display: block;
      }
      .brand span {
        font-weight: 600;
        letter-spacing: -0.02em;
        font-size: 1.05rem;
      }
      .tagline {
        font-size: 0.8rem;
        color: var(--muted);
        max-width: 14rem;
        text-align: right;
      }
      @media (max-width: 640px) {
        .tagline {
          display: none;
        }
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      .intro {
        margin-bottom: 1.75rem;
      }
      .intro h1 {
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
      }
      .intro p {
        margin: 0;
        color: var(--muted);
        max-width: 40ch;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
        gap: 1rem;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .tile-thumb {
        border: 0;
        padding: 0;
        margin: 0;
        cursor: zoom-in;
        background: #0c0c0e;
        aspect-ratio: 4 / 3;
        display: block;
        width: 100%;
      }
      .tile-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tile-video-wrap {
        position: relative;
        aspect-ratio: 4 / 3;
        background: #0c0c0e;
      }
      .tile-video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tile-expand {
        position: absolute;
        right: 0.5rem;
        bottom: 0.5rem;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.35rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 80%, transparent);
        color: var(--fg);
        cursor: pointer;
      }
      .tile-expand:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .tile-title {
        font-size: 0.9rem;
        font-weight: 500;
        margin: 0;
        padding: 0.65rem 0.85rem;
        border-top: 1px solid var(--line);
      }
      .error {
        color: #f0a0a0;
        margin: 0;
      }
      #lightbox {
        max-width: min(96vw, 1100px);
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0;
        background: var(--surface);
        color: var(--fg);
      }
      #lightbox::backdrop {
        background: rgba(0, 0, 0, 0.72);
      }
      .lightbox-inner {
        padding: 0.75rem 0.75rem 1rem;
      }
      #lightbox-media {
        border-radius: 10px;
        overflow: hidden;
        background: #0c0c0e;
        min-height: 120px;
        max-height: min(78vh, 820px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lightbox-media img,
      #lightbox-media video {
        max-width: 100%;
        max-height: min(78vh, 820px);
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
      }
      .lightbox-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      #lightbox-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }
      #lightbox-caption {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #lightbox-close {
        flex-shrink: 0;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        border-radius: 8px;
        padding: 0.35rem 0.65rem;
      }
      #lightbox-close:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">
        <img src="/media/logo.png" alt="" width="120" height="48" />
        <span>Design school work</span>
      </a>
      <p class="tagline">Images &amp; video — click a piece to enlarge.</p>
    </header>
    <main>
      <div class="intro">
        <h1>Selected work</h1>
        <p>Visual pieces from design school — click any tile for a larger view.</p>
      </div>
      <div id="grid" aria-busy="true"></div>
    </main>

    <dialog id="lightbox" aria-labelledby="lightbox-title">
      <div class="lightbox-inner">
        <div class="lightbox-head">
          <div>
            <h2 id="lightbox-title"></h2>
            <p id="lightbox-caption" hidden></p>
          </div>
          <button type="button" id="lightbox-close">Close</button>
        </div>
        <div id="lightbox-media"></div>
      </div>
    </dialog>

    <script type="module" src="./js/gallery.js"></script>
  </body>
</html>
