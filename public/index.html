<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta
      name="description"
      content="Gal Nakel — Visual Communication, Shenkar. Interactive portfolio."
    />
    <title>Gal Nakel — portfolio</title>
    <script>
      (function () {
        try {
          var k = "gals-portfolio-theme";
          var t = localStorage.getItem(k);
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--blue-nav);
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        flex-shrink: 0;
        position: relative;
        z-index: 30;
      }
      .logo-link {
        display: flex;
        align-items: center;
        line-height: 0;
        text-decoration: none;
      }
      .site-logo {
        height: clamp(2.25rem, 6vw, 3rem);
        width: auto;
        max-width: min(240px, 55vw);
        object-fit: contain;
        object-position: left center;
      }
      .nav-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
      }
      .nav-pills a {
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--pill-border);
        border: 2px solid var(--pill-border);
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
      }
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding-bottom: 0.5rem;
      }
      .hero-composition {
        position: relative;
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: 0 0.75rem;
      }
      .hero-banner {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: top;
        user-select: none;
        pointer-events: none;
      }
      #drag-stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        touch-action: none;
        z-index: 25;
        pointer-events: none;
      }
      #drag-stage .shape-btn {
        pointer-events: auto;
      }
      #drag-stage .load-error {
        pointer-events: auto;
      }
      .shape-btn {
        position: absolute;
        margin: 0;
        padding: 0;
        border: none;
        cursor: grab;
        z-index: 8;
        transition: filter 0.08s ease;
      }
      .shape-btn.shape--image {
        background: transparent;
        box-shadow: none;
        width: auto;
        height: auto;
        line-height: 0;
      }
      .shape-btn.shape--image img {
        display: block;
        width: auto;
        height: auto;
        max-width: min(260px, 46vw);
        max-height: min(220px, 34dvh);
        object-fit: contain;
        user-select: none;
        pointer-events: none;
        filter: none;
        transform: scale(1);
        transform-origin: center center;
        transition: transform 0.22s ease, filter 0.28s ease;
      }
      html[data-theme="dark"] .shape-btn.shape--image img {
        filter:
          drop-shadow(0 0 10px rgb(130 200 255 / 0.55))
          drop-shadow(0 0 22px rgb(100 175 255 / 0.42))
          drop-shadow(0 0 38px rgb(90 150 255 / 0.28));
        transform: scale(1);
      }
      .shape-btn.shape--image:hover img,
      .shape-btn.shape--image:focus-visible img {
        transform: scale(1.15);
      }
      html[data-theme="dark"] .shape-btn.shape--image:hover img,
      html[data-theme="dark"] .shape-btn.shape--image:focus-visible img {
        filter:
          drop-shadow(0 0 14px rgb(160 220 255 / 0.7))
          drop-shadow(0 0 28px rgb(120 195 255 / 0.5))
          drop-shadow(0 0 48px rgb(100 170 255 / 0.35));
      }
      .shape-btn.is-dragging {
        cursor: grabbing;
        z-index: 40 !important;
        outline: 2px solid color-mix(in srgb, var(--ink) 18%, transparent);
        outline-offset: 3px;
      }
      html[data-theme="dark"] .shape-btn.shape--image.is-dragging img {
        filter:
          drop-shadow(0 0 18px rgb(190 235 255 / 0.85))
          drop-shadow(0 0 34px rgb(140 205 255 / 0.6))
          drop-shadow(0 0 56px rgb(110 180 255 / 0.45));
      }
      html[data-theme="dark"] .shape-btn.is-dragging {
        outline: 2px solid rgb(140 200 255 / 0.45);
        outline-offset: 4px;
        box-shadow: 0 0 36px rgb(100 170 255 / 0.3);
      }
      .site-footer {
        text-align: center;
        padding: 0.75rem 1.25rem 1.25rem;
        font-size: 0.9rem;
        color: var(--muted);
        flex-shrink: 0;
        position: relative;
        z-index: 24;
      }
      .load-error {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #b00020;
        margin: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo-link" href="./" aria-label="Gal Nakel — home">
        <img class="site-logo" src="/media/logo.png" alt="Gal Nakel" width="320" height="80" />
      </a>
      <div class="header-tools">
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Switch to dark mode"
        >
          <span class="theme-toggle__swatches" aria-hidden="true">
            <span></span><span></span>
          </span>
          <span class="theme-toggle__label">Dark mode</span>
        </button>
        <nav class="nav-pills" aria-label="Primary">
          <a href="./work.html?id=about-me">about me</a>
          <a href="./work.html?id=side-quests">side quests &amp; fun stuff</a>
        </nav>
      </div>
    </header>

    <div class="main-area">
      <h1 class="visually-hidden">Gal Nakel — portfolio</h1>
      <div class="hero-composition">
        <img
          id="hero-banner"
          class="hero-banner"
          src="/media/banner.png"
          data-banner-light="/media/banner.png"
          data-banner-dark="/media/banner-dark.png"
          alt="Welcome — Gal Nakel, Visual Communication at Shenkar"
          width="1600"
          height="900"
          decoding="async"
          fetchpriority="high"
        />
        <script>
          (function () {
            var img = document.getElementById("hero-banner");
            if (!img) return;
            var light = img.getAttribute("data-banner-light") || "/media/banner.png";
            var dark = img.getAttribute("data-banner-dark") || "/media/banner-dark.png";
            function pick() {
              try {
                var t = localStorage.getItem("gals-portfolio-theme");
                if (t === "dark") return dark;
                if (t === "light") return light;
              } catch (e) {}
              if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              )
                return dark;
              return light;
            }
            var src = pick();
            if (src) img.src = src;
          })();
        </script>
      </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <div id="drag-stage" aria-label="Draggable project buttons"></div>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
