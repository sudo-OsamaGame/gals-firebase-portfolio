<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gal Nakel — Visual Communication, Shenkar. Interactive portfolio."
    />
    <title>Gal Nakel — portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --muted: #4a4a4a;
        --blue: #1b6cff;
        --blue-dark: #0f52d4;
        --green: #7fe718;
        --yellow: #ffe433;
        --orange: #ff7a2e;
        --peach: #ffd4a8;
        --pill-border: #1b6cff;
        --font-display: "Caveat", cursive;
        --font-body: "DM Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--blue-dark);
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem 0.5rem;
        flex-shrink: 0;
      }
      .logo-name {
        font-family: var(--font-display);
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 700;
        color: var(--blue);
        text-decoration: none;
        line-height: 1;
      }
      .nav-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
      }
      .nav-pills a {
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--pill-border);
        border: 2px solid var(--pill-border);
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
      }
      .nav-pills a:hover {
        background: color-mix(in srgb, var(--blue) 10%, white);
      }
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #drag-stage {
        position: relative;
        flex: 1;
        min-height: min(72dvh, 640px);
        margin: 0 0.75rem;
        touch-action: none;
      }
      .hero-block {
        position: relative;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(1rem, 4vw, 2.5rem);
        padding: 0.5rem 1rem 1rem;
        pointer-events: none;
      }
      .hero-block > * {
        pointer-events: auto;
      }
      .portrait-wrap {
        width: clamp(140px, 28vw, 200px);
        height: clamp(140px, 28vw, 200px);
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        background: linear-gradient(145deg, #e8e8e8, #f5f5f5);
        border: 4px solid var(--ink);
        position: relative;
      }
      .portrait-wrap .hero-portrait-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .portrait-missing .hero-portrait-img {
        display: none;
      }
      .portrait-missing::after {
        content: "GN";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        font-weight: 700;
        color: var(--blue);
      }
      .hero-copy {
        max-width: 22rem;
      }
      .hero-copy h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.5rem, 3.5vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .cheers-pill {
        display: inline-block;
        background: var(--peach);
        border-radius: 999px;
        padding: 0.15rem 0.65rem;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .hero-copy .my-name-is {
        margin: 0;
        font-size: clamp(1.1rem, 2.5vw, 1.35rem);
        font-weight: 700;
      }
      .hero-copy .name-big {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 700;
        color: var(--blue);
        line-height: 0.95;
        letter-spacing: -0.03em;
      }
      .shape-btn {
        position: absolute;
        margin: 0;
        padding: 0;
        border: none;
        cursor: grab;
        font-family: var(--font-body);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #fff;
        text-align: center;
        line-height: 1.05;
        z-index: 8;
        box-shadow: 0 6px 0 rgb(0 0 0 / 12%);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      .shape-btn:hover {
        filter: brightness(1.05);
      }
      .shape-btn.is-dragging {
        cursor: grabbing;
        z-index: 40 !important;
        box-shadow: 0 12px 24px rgb(0 0 0 / 18%);
        transform: scale(1.02);
      }
      .shape-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.1em;
        width: 100%;
        height: 100%;
        padding: 0.5rem;
        pointer-events: none;
      }
      .shape-line {
        display: block;
        font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      }
      .shape-blob-blue {
        width: min(200px, 42vw);
        height: min(130px, 28vw);
        border-radius: 58% 42% 62% 38% / 48% 55% 45% 52%;
        background: var(--blue);
      }
      .shape-oval-green {
        width: min(120px, 26vw);
        height: min(200px, 44vw);
        border-radius: 999px;
        background: var(--green);
        color: #0d1f00;
      }
      .shape-oval-green .shape-inner {
        transform: scaleX(0.95) scaleY(1.15);
      }
      .shape-oval-green .shape-line {
        font-size: clamp(0.75rem, 2.2vw, 0.95rem);
      }
      .shape-star-yellow {
        width: min(180px, 40vw);
        height: min(180px, 40vw);
        background: var(--yellow);
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 100%,
          50% 74%,
          21% 100%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        color: #1a1400;
        box-shadow: none;
        filter: drop-shadow(0 5px 0 rgb(0 0 0 / 10%));
      }
      .shape-star-yellow .shape-inner {
        transform: rotate(-18deg);
      }
      .shape-diamond-orange {
        width: min(150px, 34vw);
        height: min(150px, 34vw);
        background: var(--orange);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        border-radius: 0;
      }
      .shape-diamond-orange .shape-inner {
        transform: rotate(-45deg);
      }
      .shape-diamond-orange .shape-line {
        font-size: clamp(0.55rem, 1.6vw, 0.72rem);
      }
      .site-footer {
        text-align: center;
        padding: 1rem 1.25rem 1.25rem;
        font-size: 0.9rem;
        color: var(--muted);
        flex-shrink: 0;
      }
      .load-error {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #b00020;
        margin: 0;
      }
      @media (max-width: 520px) {
        .hero-block {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo-name" href="./">Gal Nakel</a>
      <nav class="nav-pills" aria-label="Primary">
        <a href="./work.html?id=about-me">about me</a>
        <a href="./work.html?id=side-quests">side quests &amp; fun stuff</a>
      </nav>
    </header>

    <div class="main-area">
      <div class="hero-block">
        <div class="portrait-wrap portrait-missing" id="portrait-wrap">
          <img class="hero-portrait-img" id="hero-portrait" alt="" width="400" height="400" />
        </div>
        <div class="hero-copy">
          <h1 id="hero-line1">Welcome!</h1>
          <span class="cheers-pill" id="hero-cheers">(and cheers I guess)</span>
          <p class="my-name-is" id="hero-line2">My name is</p>
          <p class="name-big" id="hero-name">Gal Nakel</p>
        </div>
      </div>

      <div id="drag-stage" aria-label="Draggable project buttons"></div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <script type="module" src="./js/home.js"></script>
  </body>
</html>
