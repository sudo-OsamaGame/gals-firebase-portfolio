<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Project — Gal Nakel</title>
    <script>
      (function () {
        try {
          var k = "gals-portfolio-theme";
          var t = localStorage.getItem(k);
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 1.25rem 1.25rem 2.5rem;
      }
      .back {
        display: inline-block;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--work-blue);
        border: 2px solid var(--work-blue);
        border-radius: 999px;
        padding: 0.4rem 1rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
      }
      #work-media {
        margin: 0 0 1.25rem;
        border-radius: 14px;
        overflow: hidden;
        background: var(--work-media-bg);
      }
      #work-media img,
      #work-media video {
        width: 100%;
        height: auto;
        display: block;
        vertical-align: middle;
      }
      #work-body p {
        margin: 0 0 0.85rem;
        color: var(--muted);
      }
      #work-body p:last-child {
        margin-bottom: 0;
      }
      .work-body-gallery {
        margin: 0.35rem 0 1.1rem;
        display: flex;
        flex-direction: row;
        gap: 0.35rem;
        width: 100%;
        align-items: stretch;
      }
      .work-body-gallery__thumb {
        flex: 1 1 0;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        cursor: zoom-in;
        background: var(--work-media-bg);
        box-shadow: 0 0 0 1px rgba(127, 127, 127, 0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        aspect-ratio: 9 / 18;
        position: relative;
      }
      .work-body-gallery__thumb:hover {
        transform: scale(1.02);
        box-shadow: 0 0 0 2px var(--work-blue);
      }
      .work-body-gallery__thumb:focus-visible {
        outline: 2px solid var(--work-blue);
        outline-offset: 2px;
      }
      .work-body-gallery__thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        pointer-events: none;
      }

      .work-lightbox {
        position: fixed;
        inset: 0;
        z-index: 10000;
        -webkit-tap-highlight-color: transparent;
      }
      .work-lightbox[hidden] {
        display: none !important;
      }
      .work-lightbox__backdrop {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        border: none;
        cursor: zoom-out;
        background: rgba(0, 0, 0, 0.9);
      }
      .work-lightbox__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        max-height: 100%;
        padding: 0.75rem;
        padding-top: 2.75rem;
        box-sizing: border-box;
        pointer-events: none;
      }
      .work-lightbox__toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.5rem 0.6rem;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent);
        pointer-events: auto;
      }
      .work-lightbox__counter {
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: 0.02em;
      }
      .work-lightbox__close {
        margin-left: auto;
      }
      .work-lightbox__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.5rem;
        min-height: 2.5rem;
        padding: 0 0.65rem;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .work-lightbox__btn:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.75);
      }
      .work-lightbox__btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .work-lightbox__btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .work-lightbox__stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: min(96vw, 920px);
        min-height: 0;
        touch-action: pan-y;
        pointer-events: none;
      }
      .work-lightbox__img {
        max-width: 100%;
        max-height: min(78dvh, 820px);
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 10px;
        user-select: none;
        pointer-events: auto;
        cursor: default;
      }
      .work-lightbox__nav {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        padding: 0 0.25rem;
      }
      .work-lightbox__nav .work-lightbox__btn {
        pointer-events: auto;
        font-size: 1.35rem;
        line-height: 1;
      }
      .work-lightbox__caption {
        max-width: min(96vw, 560px);
        margin-top: 0.65rem;
        text-align: center;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.88);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="work-top">
        <a class="back" href="./index.html">← Back home</a>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Switch to dark mode"
        >
          <span class="theme-toggle__swatches" aria-hidden="true">
            <span></span><span></span>
          </span>
          <span class="theme-toggle__label">Dark mode</span>
        </button>
      </div>
      <article>
        <h1 id="work-title">Loading…</h1>
        <div id="work-media"></div>
        <div id="work-body"></div>
      </article>
    </div>
    <script type="module" src="./js/work.js"></script>
  </body>
</html>
