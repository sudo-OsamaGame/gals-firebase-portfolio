<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Project — Gal Nakel</title>
    <script>
      (function () {
        try {
          var k = "gals-portfolio-theme";
          var t = localStorage.getItem(k);
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 1.25rem 1.25rem 2.5rem;
      }
      .back {
        display: inline-block;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--work-blue);
        border: 2px solid var(--work-blue);
        border-radius: 999px;
        padding: 0.4rem 1rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
      }
      #work-media {
        margin: 0 0 1.25rem;
        border-radius: 14px;
        overflow: hidden;
        background: var(--work-media-bg);
      }
      #work-media img,
      #work-media video {
        width: 100%;
        height: auto;
        display: block;
        vertical-align: middle;
      }
      #work-body p {
        margin: 0 0 0.85rem;
        color: var(--muted);
      }
      #work-body p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="work-top">
        <a class="back" href="./index.html">← Back home</a>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Switch to dark mode"
        >
          <span class="theme-toggle__swatches" aria-hidden="true">
            <span></span><span></span>
          </span>
          <span class="theme-toggle__label">Dark mode</span>
        </button>
      </div>
      <article>
        <h1 id="work-title">Loading…</h1>
        <div id="work-media"></div>
        <div id="work-body"></div>
      </article>
    </div>
    <script type="module" src="./js/work.js"></script>
  </body>
</html>
